name: Docker Build, Push and Deploy via SSM

on:
  push:
    branches:
      - week02

jobs:
  build-and-push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            build.source=github-actions
            build.workflow=${{ github.workflow }}
            build.run_id=${{ github.run_id }}
            build.run_number=${{ github.run_number }}

deploy:
  name: Deploy to EC2 via SSM
  needs: build-and-push
  runs-on: ubuntu-latest
  steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}
    
    - name: Deploy using SSM
      id: ssm-deploy
      run: |
        echo "Sending SSM command to deploy Docker container..."
        
        IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest"
        
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy Docker container from GitHub Actions" \
          --query "Command.CommandId" \
          --output text \
          --parameters "{
            \"commands\": [
              \"docker pull ${IMAGE_NAME}\",
              \"docker stop cs6620-app || true\",
              \"docker rm cs6620-app || true\",
              \"docker run -d --name cs6620-app --restart unless-stopped -p 80:3000 ${IMAGE_NAME}\",
              \"docker ps -a\"
            ]
          }")
        
        echo "SSM command sent successfully. Command ID: $COMMAND_ID"
        echo "command-id=$COMMAND_ID" >> $GITHUB_OUTPUT
    
    - name: Verify SSM command execution
      run: |
        echo "Checking SSM command execution status..."
        aws ssm list-command-invocations \
          --command-id ${{ steps.ssm-deploy.outputs.command-id }} \
          --details
